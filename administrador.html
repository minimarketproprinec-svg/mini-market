<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP Mega Propinec | Suite de Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --sidebar: #1e293b; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        aside { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 15px; background: white; border-bottom: 1px solid #334155; }
        .sidebar-menu { flex: 1; padding: 15px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; cursor: pointer; color: #94a3b8; margin-bottom: 5px; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; }
        .content-area { flex: 1; padding: 25px; overflow-y: auto; }
        .hidden { display: none !important; }

        .table-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-h { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 700; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        .p-img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; }

        .badge { padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.7rem; }
        .bg-success { background: #dcfce7; color: #166534; }
        .bg-warning { background: #fef9c3; color: #854d0e; }
        .bg-danger { background: #fee2e2; color: #991b1b; }
        .is-hidden { opacity: 0.4; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
        .modal-content { background:white; width:450px; padding:25px; border-radius:20px; position: relative; }
        .form-group { margin-bottom: 12px; }
        .form-group input, .form-group select { width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:10px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header"><img src="logo.png" style="width:100%"></div>
        <div class="sidebar-menu">
            <div class="menu-item active" onclick="switchTab('dash', this)"><i class="fas fa-th-large"></i> Dashboard</div>
            <div class="menu-item" onclick="switchTab('inv', this)"><i class="fas fa-boxes-stacked"></i> Inventario</div>
            <div class="menu-item" onclick="switchTab('cat', this)"><i class="fas fa-tags"></i> Categorías</div>
            <div class="menu-item" onclick="location.href='pedidos.html'"><i class="fas fa-print"></i> Monitor de Impresión</div>
        </div>
    </aside>

    <main>
        <header>
            <div style="font-weight:700">MASTER CONTROL CLOUD</div>
            <div style="display:flex; align-items:center; gap:10px">Admin Online <div style="width:10px; height:10px; background:var(--success); border-radius:50%"></div></div>
        </header>

        <div class="content-area">
            <div id="tab-dash">
                <h2>Caja Automática Hoy</h2>
                <p id="st-ventas" style="font-size:3rem; font-weight:800; color:var(--success)">$0.00</p>
                <br>
                <div class="table-card"><div class="table-h"><h3>Ventas Recientes</h3></div><table id="ventas-tab"><thead><tr><th>Hora</th><th>Cliente</th><th>Total</th></tr></thead><tbody id="pedidos-recientes"></tbody></table></div>
            </div>

            <div id="tab-inv" class="hidden">
                <div class="table-card">
                    <div class="table-h"><h3>Productos</h3><button class="btn-main" onclick="openM('modalInv')"><i class="fas fa-plus"></i> NUEVO</button></div>
                    <table id="inv-table"><thead><tr><th>Foto</th><th>Nombre</th><th>Cat</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="inv-body"></tbody></table>
                </div>
            </div>

            <div id="tab-cat" class="hidden">
                <div class="table-card">
                    <div class="table-h"><h3>Gestor de Categorías</h3><button class="btn-main" onclick="openM('modalCat')"><i class="fas fa-folder-plus"></i> AÑADIR</button></div>
                    <table><thead><tr><th>Icono</th><th>Nombre</th><th>Acción</th></tr></thead><tbody id="cat-body"></tbody></table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div class="modal" id="modalInv"><div class="modal-content">
        <h3>Nuevo Producto</h3><br>
        <div class="form-group"><input type="text" id="n-name" placeholder="Nombre"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px"><div class="form-group"><input type="number" id="n-price" step="0.01" placeholder="Precio"></div><div class="form-group"><input type="number" id="n-stock" placeholder="Stock"></div></div>
        <div class="form-group"><select id="n-cat-select"></select></div>
        <div class="form-group"><input type="file" id="n-img" accept="image/*"></div>
        <button class="btn-main" style="width:100%; justify-content:center" onclick="guardarP()">GUARDAR</button><br>
        <button onclick="closeM('modalInv')" style="width:100%; border:none; background:none; cursor:pointer">Cerrar</button>
    </div></div>

    <div class="modal" id="modalCat"><div class="modal-content">
        <h3>Nueva Categoría</h3><br>
        <div class="form-group"><input type="text" id="cat-name" placeholder="Nombre (Ej: Snacks)"></div>
        <div class="form-group"><input type="text" id="cat-emoji" placeholder="Emoji (Ej: 🍪)"></div>
        <button class="btn-main" style="width:100%; justify-content:center" onclick="guardarC()">AÑADIR</button><br>
        <button onclick="closeM('modalCat')" style="width:100%; border:none; background:none; cursor:pointer">Cerrar</button>
    </div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
      authDomain: "mi-mini-market.firebaseapp.com",
      projectId: "mi-mini-market",
      storageBucket: "mi-mini-market.firebasestorage.app",
      messagingSenderId: "19960510315",
      appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let masterProds = [];

    // Login
    if(prompt("🔐 Clave Admin:") !== "2024") location.href="index.html";

    // Tabs
    window.switchTab = (id, el) => {
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.content-area > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(`tab-${id}`).classList.remove('hidden');
    };

    // Categorías Dinámicas
    onSnapshot(query(collection(db, "categorias"), orderBy("nombre", "asc")), (snap) => {
        const body = document.getElementById('cat-body');
        const select = document.getElementById('n-cat-select');
        let htmlTable = "", htmlSelect = "";
        snap.forEach(d => {
            const c = d.data();
            htmlTable += `<tr><td style="font-size:1.5rem">${c.icono}</td><td><b>${c.nombre}</b></td><td><button onclick="delC('${d.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
            htmlSelect += `<option value="${c.nombre}">${c.nombre}</option>`;
        });
        body.innerHTML = htmlTable; select.innerHTML = htmlSelect;
    });

    // Productos
    onSnapshot(collection(db, "productos"), (snap) => {
        masterProds = snap.docs.map(d => ({id: d.id, ...d.data()}));
        const body = document.getElementById('inv-body');
        body.innerHTML = masterProds.map(p => {
            let b = p.stock < 10 ? 'bg-danger' : (p.stock < 20 ? 'bg-warning' : 'bg-success');
            return `<tr class="${p.visible ? '' : 'is-hidden'}"><td><img src="${p.img}" class="p-img"></td><td><b>${p.name}</b></td><td>${p.category}</td><td><span class="badge ${b}">${p.stock} UNID.</span></td>
            <td><button onclick="togV('${p.id}',${p.visible})"><i class="fas ${p.visible?'fa-eye':'fa-eye-slash'}"></i></button>
            <button onclick="delP('${p.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
        }).join('');
    });

    // Pedidos Hoy
    onSnapshot(query(collection(db, "pedidos"), orderBy("fecha", "desc"), limit(10)), (snap) => {
        let total = 0; const hoy = new Date().toLocaleDateString();
        document.getElementById('pedidos-recientes').innerHTML = snap.docs.map(d => {
            const p = d.data(); if(p.fechaTexto && p.fechaTexto.includes(hoy)) total += p.total;
            return `<tr><td>${p.fechaTexto.split(',')[1]}</td><td>${p.cliente}</td><td style="color:var(--success)">$${p.total.toFixed(2)}</td></tr>`;
        }).join('');
        document.getElementById('st-ventas').innerText = `$${total.toFixed(2)}`;
    });

    // Acciones
    window.guardarP = async () => {
        const n = document.getElementById('n-name').value, p = document.getElementById('n-price').value, s = document.getElementById('n-stock').value, file = document.getElementById('n-img').files[0];
        const r = new FileReader(); r.readAsDataURL(file);
        r.onload = async () => {
            await addDoc(collection(db, "productos"), { name: n, price: parseFloat(p), stock: parseInt(s), category: document.getElementById('n-cat-select').value, img: r.result, visible: true });
            closeM('modalInv'); Swal.fire('Éxito','Producto subido','success');
        };
    };
    window.guardarC = async () => {
        await addDoc(collection(db, "categorias"), { nombre: document.getElementById('cat-name').value, icono: document.getElementById('cat-emoji').value });
        closeM('modalCat');
    };
    window.togV = async (id, s) => await updateDoc(doc(db, "productos", id), { visible: !s });
    window.delP = async (id) => confirm("¿Eliminar?") && await deleteDoc(doc(db, "productos", id));
    window.delC = async (id) => confirm("¿Eliminar categoría?") && await deleteDoc(doc(db, "categorias", id));
    window.openM = (id) => document.getElementById(id).style.display = 'flex';
    window.closeM = (id) => document.getElementById(id).style.display = 'none';
</script>
</body>
</html>
