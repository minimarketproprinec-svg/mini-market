<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido | PROPRINEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4">

    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100 mt-4">
        <div class="bg-blue-900 p-8 text-white text-center">
            <h2 class="text-2xl font-black tracking-tighter">FINALIZAR PEDIDO</h2>
            <p class="text-[10px] uppercase font-bold text-blue-300 tracking-widest mt-1">Completa tus datos de envío</p>
        </div>

        <div class="p-8 space-y-5">
            <!-- Resumen Visual -->
            <div class="bg-blue-50 p-6 rounded-3xl border-2 border-dashed border-blue-100">
                <div class="flex justify-between items-center text-sm mb-2">
                    <span class="text-gray-500 font-bold">Productos (<span id="res-cant">0</span>):</span>
                    <span id="res-sub" class="font-black text-blue-900">$0.00</span>
                </div>
                <div class="flex justify-between items-center text-sm mb-4">
                    <span class="text-gray-500 font-bold">Costo de Envío:</span>
                    <span class="font-black text-green-600">$1.00</span>
                </div>
                <div class="flex justify-between items-center border-t border-blue-200 pt-4">
                    <span class="text-xs font-bold text-blue-400 uppercase">Total a Pagar:</span>
                    <span id="res-total" class="text-2xl font-black text-blue-900">$0.00</span>
                </div>
            </div>

            <!-- Formulario -->
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Valdez" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700">
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Ciudadela / Sector</label>
                    <input type="text" id="sector" placeholder="Ej. Ciudad El Valle" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Manzana</label>
                        <input type="text" id="mz" placeholder="Ej. Mz 4" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Villa</label>
                        <input type="text" id="villa" placeholder="Ej. V 2" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700">
                    </div>
                </div>
            </div>

            <button onclick="confirmarVenta()" id="btn-final" class="w-full bg-green-600 text-white py-5 rounded-3xl font-black text-lg shadow-xl hover:bg-green-700 transition-all flex items-center justify-center gap-3">
                <i class="fab fa-whatsapp text-2xl"></i> CONFIRMAR COMPRA
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", 
            projectId: "mi-mini-market", 
            authDomain: "mi-mini-market.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. CARGAR DATOS
        let carrito = JSON.parse(localStorage.getItem('carrito_proprinec')) || [];
        
        // SI NO HAY NADA, VOLVER AL INICIO (Para evitar el bug)
        if (carrito.length === 0) {
            window.location.replace("index.html");
        }

        const subtotal = carrito.reduce((s, i) => s + i.price, 0);
        const totalFinal = subtotal + 1.00;

        document.getElementById('res-cant').innerText = carrito.length;
        document.getElementById('res-sub').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('res-total').innerText = `$${totalFinal.toFixed(2)}`;

        window.confirmarVenta = async () => {
            const nom = document.getElementById('nombre').value;
            const sec = document.getElementById('sector').value;
            const m = document.getElementById('mz').value;
            const v = document.getElementById('villa').value;

            if(!nom || !sec) return alert("Por favor completa tu nombre y dirección");

            const btn = document.getElementById('btn-final');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> PROCESANDO...`;

            try {
                // 2. GUARDAR EN FIREBASE (Para el Ticket Automático)
                const pedidoData = {
                    cliente: nom,
                    direccion: { ciudadela: sec, manzana: m, villa: v },
                    items: carrito.map(i => ({ name: i.name, qty: 1, price: i.price })),
                    total: totalFinal,
                    pago: "WhatsApp / Transferencia",
                    estado: "Preparando",
                    fecha: new Date(),
                    fechaTexto: new Date().toLocaleString()
                };

                await addDoc(collection(db, "pedidos"), pedidoData);

                // 3. ARMAR WHATSAPP
                let msj = `*NUEVO PEDIDO - PROPRINEC*\n\n`;
                msj += `👤 *Cliente:* ${nom}\n`;
                msj += `📍 *Dir:* ${sec} - ${m} - ${v}\n\n`;
                msj += `🛒 *Productos:*\n`;
                carrito.forEach(i => msj += `- ${i.name} ($${i.price.toFixed(2)})\n`);
                msj += `\n*TOTAL A PAGAR: $${totalFinal.toFixed(2)}*`;

                // === 4. LA SOLUCIÓN DEFINITIVA ===
                
                // A. Limpiamos la memoria del carrito YA
                localStorage.removeItem('carrito_proprinec');
                localStorage.clear();

                // B. Preparamos el link
                const url = `https://wa.me/593993252739?text=${encodeURIComponent(msj)}`;

                // C. Abrimos WhatsApp en nueva pestaña
                window.open(url, '_blank');

                // D. REEMPLAZAMOS la página actual por un inicio limpio
                // replace() hace que la página de pago desaparezca del historial
                window.location.replace("index.html");

            } catch (error) {
                console.error(error);
                alert("Hubo un error de conexión");
                btn.disabled = false;
                btn.innerHTML = `<i class="fab fa-whatsapp text-2xl"></i> CONFIRMAR COMPRA`;
            }
        };
    </script>
</body>
</html>
