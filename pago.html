<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago | Mini Market Propinec</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 30px; border-radius: 25px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #ff4b4b; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 12px; outline: none; }
        .btn-met { width: 100%; padding: 15px; margin: 5px 0; border: 2px solid #eee; border-radius: 12px; cursor: pointer; background: white; font-weight: 700; text-align: left; }
        .btn-met.selected { border-color: #ff4b4b; background: #fff5f5; color: #ff4b4b; }
        .btn-f { width: 100%; padding: 20px; background: #ff4b4b; color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h2>ENTREGA</h2>
    <div id="resumen" style="background:#fff5f5; padding:15px; border-radius:15px; margin-bottom:15px"></div>
    <input type="text" id="nom" placeholder="Nombre completo">
    <input type="text" id="ciu" placeholder="Ciudadela">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px"><input type="text" id="mz" placeholder="Manzana"><input type="text" id="vi" placeholder="Villa"></div>
    <p style="font-weight:700; margin:10px 0">Pago</p>
    <button class="btn-met" id="m1" onclick="setM('Efectivo')">💵 Efectivo al recibir</button>
    <button class="btn-met" id="m2" onclick="setM('Transferencia')">🏦 Transferencia Bancaria</button>
    <button class="btn-f" id="conf">ENVIAR PEDIDO</button>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", authDomain: "mi-mini-market.firebaseapp.com", projectId: "mi-mini-market", storageBucket: "mi-mini-market.firebasestorage.app", messagingSenderId: "19960510315", appId: "1:19960510315:web:fe0743420e7ba893b2fe2e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let cart = JSON.parse(sessionStorage.getItem('market_cart')) || [], met = "";
    
    let sub = 0; cart.forEach(i => sub += i.price*i.qty); let total = sub + 1.00;
    document.getElementById('resumen').innerHTML = `<div style="display:flex; justify-content:space-between"><span>Subtotal:</span><b>$${sub.toFixed(2)}</b></div><div style="display:flex; justify-content:space-between"><span>Envío:</span><b>$1.00</b></div><hr style="margin:5px 0"><div style="display:flex; justify-content:space-between; font-size:1.2rem; color:#ff4b4b"><span>TOTAL:</span><b>$${total.toFixed(2)}</b></div>`;

    window.setM = (m) => { met = m; document.getElementById('m1').className = m==='Efectivo'?'btn-met selected':'btn-met'; document.getElementById('m2').className = m==='Transferencia'?'btn-met selected':'btn-met'; };
    document.getElementById('conf').onclick = async () => {
        const n = document.getElementById('nom').value, c = document.getElementById('ciu').value;
        if(!n || !c || !met) return alert("Completa los datos");
        document.getElementById('conf').disabled = true;
        try {
            for (const i of cart) { const ref = doc(db,"productos",i.id); const s = await getDoc(ref); if(s.exists()) await updateDoc(ref, {stock: s.data().stock - i.qty}); }
            await addDoc(collection(db,"pedidos"), {cliente: n, items: cart, total: total, pago: met, fecha: Date.now(), fechaTexto: new Date().toLocaleString(), estado: "Preparando", direccion: {ciudadela: c, manzana: document.getElementById('mz').value, villa: document.getElementById('vi').value}});
            sessionStorage.removeItem('market_cart'); window.open(`https://wa.me/593993252739?text=Nuevo pedido de ${n}`); location.href="index.html";
        } catch (e) { document.getElementById('conf').disabled = false; }
    };
</script>
</body>
</html>
