<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido | Mi Mini Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --py-red: #EF4143; --bg: #f8fafc; --dark: #292929; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding: 20px; display: flex; justify-content: center; }
        .checkout-box { background: white; padding: 25px; border-radius: 20px; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { font-weight: 800; margin-bottom: 20px; text-align: center; color: var(--py-red); }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; outline: none; font-size: 0.9rem; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .resumen { background: #fff5f5; padding: 15px; border-radius: 15px; margin: 15px 0; border: 1px dashed var(--py-red); }
        .metodo-btn { width: 100%; padding: 15px; margin: 5px 0; border: 2px solid #eee; border-radius: 12px; cursor: pointer; background: white; font-weight: 700; text-align: left; transition: 0.3s; }
        .metodo-btn.selected { border-color: var(--py-red); background: #fff5f5; color: var(--py-red); }
        .detalles { display: none; padding: 15px; background: #f1f5f9; border-radius: 12px; margin-top: 5px; }
        .grid-billetes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .billete { padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; background: white; font-size: 0.8rem; font-weight: 600; }
        .billete.active { background: var(--dark); color: white; border-color: var(--dark); }
        .btn-enviar { width: 100%; padding: 20px; border: none; border-radius: 15px; background: var(--py-red); color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 20px; box-shadow: 0 6px 20px rgba(239, 65, 67, 0.3); }
        .btn-enviar:disabled { background: #ccc; box-shadow: none; }
    </style>
</head>
<body>

<div class="checkout-box">
    <a href="index.html" style="text-decoration:none; color:gray; font-size:0.8rem;"><i class="fas fa-arrow-left"></i> Volver a la tienda</a>
    <h2>DATOS DE ENTREGA</h2>
    
    <div class="input-group"><label>Nombre Completo</label><input type="text" id="cli-nombre" placeholder="Ej: Juan Pérez"></div>
    <div class="input-group"><label>Ciudadela / Urbanización</label><input type="text" id="cli-ciu" placeholder="Nombre de su sector"></div>
    
    <div class="row">
        <div class="input-group"><label>Manzana (Mz)</label><input type="text" id="cli-mz" placeholder="Ej: L"></div>
        <div class="input-group"><label>Villa / Casa #</label><input type="text" id="cli-villa" placeholder="Ej: 12"></div>
    </div>

    <div class="resumen" id="resumen-lista"></div>

    <p><b>¿Cómo pagas?</b></p>
    <button class="metodo-btn" id="btn-cash"><i class="fas fa-money-bill-wave"></i> Efectivo al recibir</button>
    <div id="area-cash" class="detalles">
        <p style="font-size: 0.8rem;">¿Con cuánto pagas?</p>
        <div class="grid-billetes">
            <div class="billete" data-val="5">$5</div>
            <div class="billete" data-val="10">$10</div>
            <div class="billete" data-val="20">$20</div>
            <div class="billete" data-val="50">$50</div>
            <div class="billete" data-val="Exacto">Exacto</div>
        </div>
    </div>

    <button class="metodo-btn" id="btn-transfer"><i class="fas fa-university"></i> Transferencia</button>
    <div id="area-transfer" class="detalles">
        <p style="font-size:0.8rem"><b>Pichincha:</b> 123456789<br><b>Guayaquil:</b> 987654321</p>
    </div>

    <button class="btn-enviar" id="btn-finalizar">ENVIAR PEDIDO</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
        authDomain: "mi-mini-market.firebaseapp.com",
        projectId: "mi-mini-market",
        storageBucket: "mi-mini-market.firebasestorage.app",
        messagingSenderId: "19960510315",
        appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const carrito = JSON.parse(sessionStorage.getItem('market_cart')) || [];
    let metPago = "";
    let valBillete = "";
    let totalCaja = 0;

    // Cargar Resumen
    const resDiv = document.getElementById('resumen-lista');
    carrito.forEach(i => {
        totalCaja += i.price * i.qty;
        resDiv.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:0.85rem"><span>${i.name} (x${i.qty})</span><b>$${(i.price*i.qty).toFixed(2)}</b></div>`;
    });
    resDiv.innerHTML += `<div style="text-align:right; font-weight:800; margin-top:10px; font-size:1.1rem">Total: $${totalCaja.toFixed(2)}</div>`;

    // Botones de Pago
    document.getElementById('btn-cash').onclick = () => { metPago="efectivo"; selectMet('btn-cash','area-cash'); };
    document.getElementById('btn-transfer').onclick = () => { metPago="transferencia"; selectMet('btn-transfer','area-transfer'); };
    function selectMet(btnId, areaId) {
        document.querySelectorAll('.metodo-btn').forEach(b => b.classList.remove('selected'));
        document.querySelectorAll('.detalles').forEach(a => a.style.display = 'none');
        document.getElementById(btnId).classList.add('selected');
        document.getElementById(areaId).style.display = 'block';
    }

    // Billetes
    const bills = document.querySelectorAll('.billete');
    bills.forEach(b => {
        b.onclick = () => {
            bills.forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            valBillete = b.getAttribute('data-val');
        };
    });

    // PROCESAR TODO
    document.getElementById('btn-finalizar').onclick = async () => {
        const nom = document.getElementById('cli-nombre').value;
        const ciu = document.getElementById('cli-ciu').value;
        if(!nom || !ciu || !metPago) return alert("Por favor, llena los datos de entrega y pago.");
        if(metPago === 'efectivo' && !valBillete) return alert("Dinos con cuánto vas a pagar.");

        document.getElementById('btn-finalizar').disabled = true;
        document.getElementById('btn-finalizar').innerText = "PROCESANDO STOCK...";

        try {
            // 1. Descontar Inventario
            for (const i of carrito) {
                const ref = doc(db, "productos", i.id);
                const snp = await getDoc(ref);
                if(snp.exists()) await updateDoc(ref, { stock: snp.data().stock - i.qty });
            }

            // 2. Guardar Pedido para Impresora (Usando timestamp para orden real)
            await addDoc(collection(db, "pedidos"), {
                cliente: nom,
                direccion: { ciudadela: ciu, manzana: document.getElementById('cli-mz').value, villa: document.getElementById('cli-villa').value },
                items: carrito,
                pago: metPago,
                pagaCon: valBillete,
                total: totalCaja,
                fecha: Date.now(), // CLAVE PARA ORDEN
                fechaTexto: new Date().toLocaleString()
            });

            // 3. WhatsApp y Limpieza
            let msg = `*NUEVO PEDIDO*%0ACliente: ${nom}%0ADir: ${ciu}, Mz ${document.getElementById('cli-mz').value}, Vlla ${document.getElementById('cli-villa').value}%0A%0A`;
            carrito.forEach(i => msg += `- ${i.name} (x${i.qty})%0A`);
            msg += `%0A*TOTAL: $${totalCaja.toFixed(2)}*%0A*PAGO:* ${metPago.toUpperCase()}`;
            if(metPago === 'efectivo') msg += `%0A*BILLETE:* $${valBillete}`;

            sessionStorage.removeItem('market_cart');
            window.open(`https://wa.me/593993252739?text=${msg}`);
            window.location.href = "index.html";

        } catch (e) {
            alert("Error de conexión. Inténtalo de nuevo.");
            document.getElementById('btn-finalizar').disabled = false;
        }
    };
</script>
</body>
</html>
