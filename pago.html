<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MINI MARKET PROPRINEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 p-4">

    <div class="max-w-md mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-blue-900 p-8 text-white text-center">
            <div class="w-16 h-16 bg-blue-800 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fas fa-map-marker-alt"></i>
            </div>
            <h2 class="text-2xl font-black italic">FINALIZAR PEDIDO</h2>
            <p class="text-xs text-blue-300 font-bold uppercase tracking-tighter">Mini Market Proprinec</p>
        </div>

        <div class="p-8 space-y-6">
            <!-- Formulario -->
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Nombre y Apellido</label>
                    <input type="text" id="cliente" placeholder="Ej. Juan Pérez" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-700 shadow-inner">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Ciudadela</label>
                        <input type="text" id="ciudadela" placeholder="Ej. El Chorrillo" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Mz / Villa</label>
                        <input type="text" id="casa" placeholder="Mz 4 V 2" class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-700 shadow-inner">
                    </div>
                </div>
            </div>

            <!-- Resumen -->
            <div class="bg-slate-50 p-6 rounded-3xl border border-dashed border-gray-200">
                <h4 class="text-xs font-black text-slate-400 uppercase mb-3 flex justify-between">
                    <span>Resumen de Productos</span>
                    <span id="resumen-cant">0 ítems</span>
                </h4>
                <div id="items-list" class="text-sm font-bold text-slate-700 space-y-2 mb-4"></div>
                <div class="flex justify-between items-center border-t border-gray-200 pt-4">
                    <span class="text-xs font-bold text-gray-400">TOTAL A PAGAR:</span>
                    <span id="final-total" class="text-2xl font-black text-blue-900">$0.00</span>
                </div>
            </div>

            <!-- Botón -->
            <button onclick="confirmarPedido()" id="btn-envio" class="w-full bg-green-600 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-green-100 hover:bg-green-700 transition-all flex items-center justify-center gap-3">
                <i class="fab fa-whatsapp text-2xl"></i> CONFIRMAR PEDIDO
            </button>
            <button onclick="location.href='index.html'" class="w-full text-gray-400 text-xs font-bold uppercase tracking-widest hover:text-blue-600">
                <i class="fas fa-arrow-left mr-1"></i> Regresar al catálogo
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", 
            projectId: "mi-mini-market", 
            authDomain: "mi-mini-market.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cargar Carrito
        let carrito = JSON.parse(localStorage.getItem('proprinec_cart')) || [];
        if(carrito.length === 0) window.location.href = "index.html";

        // Renderizar Resumen
        const total = carrito.reduce((s, i) => s + i.price, 0);
        document.getElementById('final-total').innerText = `$${total.toFixed(2)}`;
        document.getElementById('resumen-cant').innerText = `${carrito.length} ítems`;
        document.getElementById('items-list').innerHTML = carrito.map(i => `
            <div class="flex justify-between">
                <span>• ${i.name}</span>
                <span>$${i.price.toFixed(2)}</span>
            </div>
        `).join('');

        window.confirmarPedido = async () => {
            const cli = document.getElementById('cliente').value;
            const ciu = document.getElementById('ciudadela').value;
            const cas = document.getElementById('casa').value;

            if(!cli || !ciu) {
                Swal.fire("¡Faltan datos!", "Por favor indica tu nombre y ubicación", "warning");
                return;
            }

            const btn = document.getElementById('btn-envio');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> PROCESANDO...`;

            try {
                // 1. GUARDAR EN FIREBASE (Para el panel de logística y auto-print)
                const pedidoDB = {
                    cliente: cli,
                    direccion: { ciudadela: ciu, manzana: cas, villa: "-" },
                    items: carrito.map(i => ({ name: i.name, qty: 1, price: i.price })),
                    total: total,
                    pago: "WhatsApp / Transferencia",
                    estado: "Preparando",
                    fecha: new Date(),
                    fechaTexto: new Date().toLocaleString()
                };

                await addDoc(collection(db, "pedidos"), pedidoDB);

                // 2. PREPARAR MENSAJE WHATSAPP
                let msg = `*NUEVO PEDIDO - PROPRINEC*\n\n`;
                msg += `👤 *Cliente:* ${cli}\n`;
                msg += `📍 *Ubicación:* ${ciu} - ${cas}\n\n`;
                msg += `🛒 *Detalle:*\n`;
                carrito.forEach(i => msg += `- ${i.name} ($${i.price.toFixed(2)})\n`);
                msg += `\n*TOTAL A PAGAR: $${total.toFixed(2)}*`;

                // === 3. LIMPIEZA TOTAL (Aquí está la solución al fallo) ===
                localStorage.removeItem('proprinec_cart');
                localStorage.clear();

                // 4. ACCIÓN DOBLE
                const tel = "593993252739"; // Tu número de Proprinec
                const url = `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
                
                // Abrir WhatsApp en nueva pestaña
                window.open(url, '_blank');

                // Redirigir esta página al inicio (ya vacío)
                window.location.href = "index.html";

            } catch (e) {
                console.error(e);
                Swal.fire("Error", "No se pudo conectar con el sistema", "error");
                btn.disabled = false;
                btn.innerHTML = `<i class="fab fa-whatsapp text-2xl"></i> CONFIRMAR PEDIDO`;
            }
        };
    </script>
</body>
</html>
