<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Propinec | Finalizar Pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --py-red: #EF4143; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 30px; border-radius: 20px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { font-weight: 800; color: var(--py-red); text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 12px; outline: none; }
        .btn-pago { width: 100%; padding: 15px; margin: 5px 0; border: 2px solid #eee; border-radius: 12px; cursor: pointer; background: white; font-weight: 700; text-align: left; }
        .btn-pago.selected { border-color: var(--py-red); background: #fff5f5; color: var(--py-red); }
        .bill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
        .bill { padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; background: white; font-size: 0.8rem; font-weight: 600; }
        .bill.active { background: #292929; color: white; }
        .btn-final { width: 100%; padding: 20px; background: var(--py-red); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 15px rgba(239, 65, 67, 0.3); }
        .btn-final:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="box">
    <h2>DATOS DE ENTREGA</h2>
    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="text" id="ciudadela" placeholder="Ciudadela">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px"><input type="text" id="mz" placeholder="Manzana"><input type="text" id="villa" placeholder="Villa"></div>
    
    <p style="font-weight:700; margin:10px 0">Método de Pago</p>
    <button class="btn-pago" id="p-e" onclick="setM('Efectivo')">💵 Efectivo al recibir</button>
    <div id="bill-opt" style="display:none">
        <p style="font-size:0.8rem">¿Con cuánto pagas?</p>
        <div class="bill-grid">
            <div class="bill" data-v="5">$5</div><div class="bill" data-v="10">$10</div><div class="bill" data-v="20">$20</div><div class="bill" data-v="50">$50</div><div class="bill" data-v="Exacto">Exacto</div>
        </div>
    </div>
    <button class="btn-pago" id="p-t" onclick="setM('Transferencia')">🏦 Transferencia Bancaria</button>

    <button class="btn-final" id="confirmar">ENVIAR PEDIDO</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
      authDomain: "mi-mini-market.firebaseapp.com",
      projectId: "mi-mini-market",
      storageBucket: "mi-mini-market.firebasestorage.app",
      messagingSenderId: "19960510315",
      appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let carrito = JSON.parse(sessionStorage.getItem('market_cart')) || [], met = "", billVal = "";

    window.setM = (m) => {
        met = m; document.getElementById('p-e').className = m=='Efectivo'?'btn-pago selected':'btn-pago';
        document.getElementById('p-t').className = m=='Transferencia'?'btn-pago selected':'btn-pago';
        document.getElementById('bill-opt').style.display = m=='Efectivo'?'block':'none';
    };

    document.querySelectorAll('.bill').forEach(b => {
        b.onclick = () => { document.querySelectorAll('.bill').forEach(x => x.classList.remove('active')); b.classList.add('active'); billVal = b.getAttribute('data-v'); };
    });

    document.getElementById('confirmar').onclick = async () => {
        const nom = document.getElementById('nombre').value, ciu = document.getElementById('ciudadela').value;
        if(!nom || !ciu || !met) return alert("Completa los datos");
        const btn = document.getElementById('confirmar'); btn.disabled = true; btn.innerText = "PROCESANDO...";

        let total = 0; carrito.forEach(i => total += i.price * i.qty);

        try {
            // 1. Restar Stock
            for (const i of carrito) {
                const ref = doc(db, "productos", i.id); const s = await getDoc(ref);
                if(s.exists()) await updateDoc(ref, { stock: s.data().stock - i.qty });
            }
            // 2. Guardar Pedido (Esto activa la impresora)
            await addDoc(collection(db, "pedidos"), {
                cliente: nom, items: carrito, pago: met, pagaCon: billVal, total: total, fecha: Date.now(),
                fechaTexto: new Date().toLocaleString(), direccion: { ciudadela: ciu, manzana: document.getElementById('mz').value, villa: document.getElementById('villa').value }
            });
            // 3. WhatsApp
            let msg = `*NUEVO PEDIDO Mega Propinec*%0ACliente: ${nom}%0ATotal: $${total.toFixed(2)}`;
            sessionStorage.removeItem('market_cart'); window.open(`https://wa.me/593993252739?text=${msg}`);
            window.location.href="index.html";
        } catch (e) { alert("Error"); btn.disabled = false; }
    };
</script>
</body>
</html>
