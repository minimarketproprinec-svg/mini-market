<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | MINI MARKET PROPRINEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.2s; }
        .product-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="pb-32">

    <header class="bg-blue-900 text-white p-5 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-black italic text-2xl tracking-tighter">PROPRINEC</h1>
            <div class="bg-blue-800 px-4 py-2 rounded-full flex items-center gap-2 border border-blue-700">
                <i class="fas fa-shopping-cart text-yellow-400"></i>
                <span id="cart-count" class="font-bold text-lg">0</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-5xl">
        <!-- Ejemplo de Categoría -->
        <h2 class="font-bold text-gray-400 text-xs uppercase tracking-widest mb-4 mt-6">Productos Destacados</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Producto 1 -->
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 product-card flex flex-col items-center">
                <div class="w-full h-32 bg-slate-50 rounded-2xl mb-3 flex items-center justify-center text-4xl">🍞</div>
                <h3 class="font-bold text-gray-800 text-sm text-center">Pan de Casa</h3>
                <p class="text-blue-600 font-black text-lg">$0.15</p>
                <button onclick="agregarAlCarrito('Pan de Casa', 0.15)" class="w-full mt-3 bg-blue-600 text-white py-2 rounded-xl text-xs font-bold uppercase shadow-md active:bg-blue-800">Agregar</button>
            </div>

            <!-- Producto 2 -->
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 product-card flex flex-col items-center">
                <div class="w-full h-32 bg-slate-50 rounded-2xl mb-3 flex items-center justify-center text-4xl">🥛</div>
                <h3 class="font-bold text-gray-800 text-sm text-center">Leche Entera</h3>
                <p class="text-blue-600 font-black text-lg">$1.10</p>
                <button onclick="agregarAlCarrito('Leche Entera', 1.10)" class="w-full mt-3 bg-blue-600 text-white py-2 rounded-xl text-xs font-bold uppercase shadow-md active:bg-blue-800">Agregar</button>
            </div>
        </div>
    </main>

    <!-- Barra de Pago Flotante -->
    <div id="cart-bar" class="fixed bottom-0 w-full bg-white border-t border-gray-100 p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] transition-all translate-y-full">
        <div class="container mx-auto flex justify-between items-center max-w-5xl">
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Total a pagar</p>
                <p id="cart-total" class="text-2xl font-black text-blue-900">$0.00</p>
            </div>
            <button onclick="irAPagar()" class="bg-green-600 text-white px-8 py-3 rounded-2xl font-bold flex items-center gap-3 hover:bg-green-700 transition shadow-lg">
                FINALIZAR PEDIDO <i class="fas fa-chevron-right text-xs"></i>
            </button>
        </div>
    </div>

    <script>
        let carrito = [];

        // Al cargar la página recuperamos el carrito o iniciamos vacío
        window.onload = () => {
            const data = localStorage.getItem('carrito_proprinec');
            if (data) {
                carrito = JSON.parse(data);
                render();
            }
        };

        function agregarAlCarrito(name, price) {
            carrito.push({ name, price });
            localStorage.setItem('carrito_proprinec', JSON.stringify(carrito));
            render();
        }

        function render() {
            document.getElementById('cart-count').innerText = carrito.length;
            const total = carrito.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            
            const bar = document.getElementById('cart-bar');
            if (carrito.length > 0) {
                bar.classList.remove('translate-y-full');
            } else {
                bar.classList.add('translate-y-full');
            }
        }

        function irAPagar() {
            if (carrito.length > 0) {
                window.location.href = "pago.html";
            }
        }
    </script>
</body>
</html>
