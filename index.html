<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Mini Market Propinec</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main: #ff4b4b; /* Rojo Propinec */
            --bg: #f4f7f6; 
            --white: #ffffff;
            --dark: #1a1a1a;
            --success: #10b981; /* Verde solo para envíos/disponibilidad */
            --gray: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--dark); overflow-x: hidden; }

        /* --- ENCABEZADO MODERNO (STICKY) --- */
        header { 
            background: var(--white); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 10px 5%;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo-img { height: 50px; cursor: pointer; transition: 0.3s; }
        
        .search-container { flex: 1; max-width: 600px; position: relative; display: flex; gap: 10px; }
        .search-box { 
            flex: 1; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; 
            padding: 0 15px; border: 2px solid transparent; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--main); background: white; }
        #search { border: none; background: transparent; padding: 12px; width: 100%; outline: none; font-weight: 500; }
        .btn-search { background: var(--main); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        .header-actions { display: flex; gap: 15px; align-items: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; color: var(--gray); cursor: pointer; font-size: 0.7rem; font-weight: 600; text-decoration: none; position: relative; }
        .action-item i { font-size: 1.4rem; color: var(--dark); margin-bottom: 3px; transition: 0.3s; }
        .action-item:hover i { color: var(--main); transform: translateY(-2px); }
        
        /* Contador Carrito */
        #count { 
            position: absolute; top: -5px; right: -5px; background: var(--main); color: white; 
            font-size: 0.6rem; width: 18px; height: 18px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; border: 2px solid white;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        .nav-bar { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 5%; background: white; border-top: 1px solid var(--border);
        }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--main); }
        .hot-label { background: var(--main); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
        
        .btn-cats { background: var(--main); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .shipping-card { background: #ecfdf5; color: #047857; padding: 8px 15px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* --- BANNERS PRINCIPALES --- */
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 5%; }
        .banner { 
            height: 200px; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; 
            justify-content: center; background-size: cover; background-position: center; position: relative; overflow: hidden;
            color: white; transition: 0.3s; cursor: pointer;
        }
        .banner:hover { transform: scale(1.02); }
        .banner.fresh { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=800'); }
        .banner.delivery { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1585759071429-1646f76ab8c7?auto=format&fit=crop&w=800'); }
        .banner h2 { font-size: 1.8rem; font-weight: 800; z-index: 1; }
        .banner p { font-weight: 500; margin-bottom: 15px; z-index: 1; }
        .banner-btn { width: fit-content; padding: 10px 20px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; z-index: 1; }

        /* --- CARRUSEL DE CATEGORÍAS --- */
        .categories-section { padding: 20px 5%; }
        .cat-carousel { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .cat-item { 
            min-width: 120px; background: white; padding: 15px; border-radius: 16px; 
            text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .cat-item:hover { transform: translateY(-5px); border-color: var(--main); }
        .cat-item.active { border-color: var(--main); background: #fff5f5; }
        .cat-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }
        .cat-item span { font-size: 0.8rem; font-weight: 700; color: var(--dark); }

        /* --- GRID DE PRODUCTOS --- */
        .products-section { padding: 20px 5% 80px; }
        .section-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); /* Escritorio: 6 */
            gap: 20px; 
        }
        
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } } /* Tablet: 4 */
        @media (max-width: 768px) { 
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } /* Celular: 2 */
            .hero { grid-template-columns: 1fr; }
            .header-top { gap: 10px; }
            .search-container { order: 3; max-width: 100%; width: 100%; margin-top: 10px; }
            .header-top { flex-wrap: wrap; }
        }

        .card { 
            background: var(--white); border-radius: 18px; padding: 12px; position: relative;
            transition: 0.3s; border: 1px solid var(--border); display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-color: var(--main); }
        
        .card-img-container { position: relative; width: 100%; aspect-ratio: 1/1; margin-bottom: 12px; overflow: hidden; border-radius: 12px; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .card:hover img { transform: scale(1.1); }
        
        .badge-promo { position: absolute; top: 8px; left: 8px; background: var(--main); color: white; font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; z-index: 1; }
        .fav-btn { position: absolute; top: 8px; right: 8px; background: white; width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: #cbd5e1; cursor: pointer; transition: 0.3s; }
        .fav-btn:hover { color: var(--main); }

        .card h4 { font-size: 0.85rem; font-weight: 700; height: 40px; overflow: hidden; margin-bottom: 5px; color: var(--dark); }
        .stock-label { font-size: 0.65rem; font-weight: 600; color: var(--gray); margin-bottom: 10px; }
        
        .price-container { margin-top: auto; display: flex; align-items: baseline; gap: 8px; }
        .current-price { font-size: 1.1rem; font-weight: 800; color: var(--dark); }
        .old-price { font-size: 0.8rem; color: var(--gray); text-decoration: line-through; }
        
        .btn-add { 
            position: absolute; bottom: 12px; right: 12px; background: var(--main); color: white; 
            width: 35px; height: 35px; border-radius: 10px; border: none; cursor: pointer; 
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-add:hover { transform: rotate(90deg); background: var(--dark); }

        /* --- CARRITO (SIDEBAR) --- */
        #sidebar { 
            position: fixed; right: -400px; top: 0; width: 380px; height: 100%; 
            background: white; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 30px; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); 
        }
        #sidebar.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .cart-list { flex: 1; overflow-y: auto; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .cart-item img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        
        .btn-check { 
            background: var(--main); color: white; border: none; padding: 18px; 
            border-radius: 16px; width: 100%; font-weight: 800; cursor: pointer; 
            font-size: 1rem; transition: 0.3s; margin-top: 15px;
        }
        .btn-check:hover { background: var(--dark); transform: translateY(-2px); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1500; display: none; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <img src="logo.jpg" class="logo-img" alt="Mini Market Propinec" onclick="location.reload()">
            
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search" style="color: #94a3b8;"></i>
                    <input type="text" id="search" placeholder="Buscar productos, marcas y más...">
                </div>
                <button class="btn-search">Buscar</button>
            </div>

            <div class="header-actions">
                <div class="action-item"><i class="fas fa-user-circle"></i> Mi Cuenta</div>
                <div class="action-item" onclick="toggleCart()">
                    <i class="fas fa-shopping-basket"></i> Mi Carrito
                    <span id="count">0</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="nav-links">
            <div class="btn-cats"><i class="fas fa-bars"></i> Categorías</div>
            <a href="#">Inicio</a>
            <a href="#">Ofertas <span class="hot-label">HOT</span></a>
            <a href="#">Nuevos</a>
            <a href="#">Más Vendidos</a>
            <a href="#">Quiénes Somos</a>
        </div>
        <div class="shipping-card">
            <i class="fas fa-bolt"></i>
            <span>Envío Rápido en pedidos seleccionados</span>
        </div>
    </nav>

    <section class="hero">
        <div class="banner fresh">
            <h2>Productos Frescos</h2>
            <p>Frutas, verduras y carnes de hoy.</p>
            <button class="banner-btn" style="background: var(--main); color: white;">Ver Catálogo</button>
        </div>
        <div class="banner delivery">
            <h2>Entrega Veloz</h2>
            <p>Recibe tu pedido en minutos.</p>
            <button class="banner-btn" style="background: var(--success); color: white;">Pedir Ahora</button>
        </div>
    </section>

    <section class="categories-section">
        <div class="cat-carousel" id="cat-list">
            <!-- Categorías dinámicas aquí -->
        </div>
    </section>

    <section class="products-section">
        <div class="section-title">
            <h3 id="cat-title">Todos los Productos</h3>
        </div>
        <div class="grid" id="product-grid">
            <!-- Productos dinámicos aquí -->
        </div>
    </section>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    
    <div id="sidebar">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <i class="fas fa-times" onclick="toggleCart()" style="cursor:pointer; font-size: 1.2rem;"></i>
        </div>
        <div class="cart-list" id="cart-items">
            <!-- Items del carrito aquí -->
        </div>
        <div style="padding-top:20px; border-top:2px solid #f1f5f9">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px; color: var(--gray);">
                <span>Subtotal:</span><span id="subtotal-p">$0.00</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:800; font-size:1.3rem">
                <span>Total:</span><span id="total-p" style="color: var(--main)">$0.00</span>
            </div>
            <button class="btn-check" onclick="location.href='pago.html'">FINALIZAR COMPRA</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", authDomain: "mi-mini-market.firebaseapp.com", projectId: "mi-mini-market", storageBucket: "mi-mini-market.firebasestorage.app", messagingSenderId: "19960510315", appId: "1:19960510315:web:fe0743420e7ba893b2fe2e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    
    let allProds = [], cart = JSON.parse(sessionStorage.getItem('market_cart')) || [];

    // Cargar Categorías
    onSnapshot(query(collection(db, "categorias"), orderBy("nombre", "asc")), (snap) => {
        let h = `<div class="cat-item active" onclick="window.filterCat('Todos', this)">
                    <span class="cat-icon">🏠</span><span>Todos</span>
                 </div>`;
        snap.forEach(d => { 
            h += `<div class="cat-item" onclick="window.filterCat('${d.data().nombre}', this)">
                    <span class="cat-icon">${d.data().icono}</span><span>${d.data().nombre}</span>
                  </div>`; 
        });
        document.getElementById('cat-list').innerHTML = h;
    });

    // Cargar Productos
    onSnapshot(collection(db, "productos"), (snap) => {
        allProds = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderS(allProds);
    });

    function renderS(list) {
        const grid = document.getElementById('product-grid'); grid.innerHTML = '';
        list.filter(p => p.visible !== false && p.stock > 0).forEach(p => {
            const hasPromo = p.promoActive && p.promoPrice;
            const priceFinal = hasPromo ? p.promoPrice : p.price;
            
            grid.innerHTML += `
                <div class="card">
                    ${hasPromo ? `<div class="badge-promo">OFERTA</div>` : ''}
                    <button class="fav-btn"><i class="fas fa-heart"></i></button>
                    <div class="card-img-container">
                        <img src="${p.img}" loading="lazy">
                    </div>
                    <h4>${p.name}</h4>
                    <p class="stock-label"><i class="fas fa-check-circle" style="color:var(--success)"></i> ${p.stock} disponibles</p>
                    <div class="price-container">
                        <span class="current-price">$${parseFloat(priceFinal).toFixed(2)}</span>
                        ${hasPromo ? `<span class="old-price">$${p.price}</span>` : ''}
                    </div>
                    <button class="btn-add" onclick="addC('${p.id}','${p.name}',${priceFinal},'${p.img}',${p.stock})">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>`;
        });
    }

    // Lógica del Carrito (Mantenida 100%)
    window.addC = (id, n, p, i, max) => {
        const ex = cart.find(x => x.id === id); 
        if(ex && ex.qty >= max) return;
        ex ? ex.qty++ : cart.push({id, name: n, price: p, img: i, qty: 1});
        save();
        // Nota: La especificación dice NO abrir automáticamente, solo actualizar contador.
        // He quitado la apertura automática en save() para cumplir con "UX premium".
    }

    function save() { 
        sessionStorage.setItem('market_cart', JSON.stringify(cart)); 
        renderC(); 
    }

    function renderC() {
        let total = 0, count = 0; 
        document.getElementById('cart-items').innerHTML = cart.map((item) => {
            total += item.price * item.qty; count += item.qty;
            return `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex:1">
                        <b style="font-size:0.85rem">${item.name}</b><br>
                        <small style="color:var(--gray)">$${parseFloat(item.price).toFixed(2)} x ${item.qty}</small>
                    </div>
                    <b style="font-size:0.9rem">$${(item.price * item.qty).toFixed(2)}</b>
                </div>`;
        }).join('');
        document.getElementById('count').innerText = count; 
        document.getElementById('subtotal-p').innerText = `$${total.toFixed(2)}`;
        document.getElementById('total-p').innerText = `$${total.toFixed(2)}`;
    }

    window.filterCat = (cat, btn) => { 
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active')); 
        btn.classList.add('active'); 
        document.getElementById('cat-title').innerText = cat === 'Todos' ? 'Todos los Productos' : cat;
        renderS(cat === 'Todos' ? allProds : allProds.filter(p => p.category === cat)); 
    };

    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderS(allProds.filter(p => p.name.toLowerCase().includes(val)));
    };

    window.toggleCart = () => { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }

    renderC();
</script>
</body>
</html>
