<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Mini Market Propinec</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --main: #ff4b4b; /* Rojo Propinec */
            --bg: #f4f7f6; 
            --white: #ffffff;
            --dark: #1a1a1a;
            --success: #10b981;
            --gray: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--dark); overflow-x: hidden; }

        /* --- ENCABEZADO MODERNO --- */
        header { 
            background: var(--white); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 10px 5%;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo-img { height: 45px; cursor: pointer; }
        
        .search-container { flex: 1; max-width: 600px; position: relative; display: flex; gap: 10px; }
        .search-box { 
            flex: 1; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; 
            padding: 0 15px; border: 2px solid transparent; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--main); background: white; }
        #search { border: none; background: transparent; padding: 12px; width: 100%; outline: none; font-weight: 500; }
        .btn-search { background: var(--main); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        .header-actions { display: flex; gap: 15px; align-items: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; color: var(--gray); cursor: pointer; font-size: 0.65rem; font-weight: 700; position: relative; }
        .action-item i { font-size: 1.3rem; color: var(--dark); margin-bottom: 2px; }
        
        #count { 
            position: absolute; top: -5px; right: -5px; background: var(--main); color: white; 
            font-size: 0.6rem; width: 18px; height: 18px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; border: 2px solid white;
        }

        /* --- BARRA DE NAVEGACIÓN RESPONSIVE (CARRUSEL EN MÓVIL) --- */
        .nav-bar { 
            background: white; 
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 15px;
            padding: 10px 0;
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--dark); 
            font-weight: 600; 
            font-size: 0.85rem; 
            white-space: nowrap;
            transition: 0.3s;
        }

        .btn-cats { 
            background: var(--main); 
            color: white; 
            padding: 8px 18px; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 0.85rem;
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer;
            white-space: nowrap;
        }

        .hot-label { background: var(--main); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        .shipping-card { 
            background: #ecfdf5; 
            color: #047857; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 0.7rem; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        /* DISEÑO PARA CELULARES (CARRUSEL) */
        @media (max-width: 768px) {
            .nav-bar { padding: 0; }
            .nav-links {
                overflow-x: auto;
                padding: 10px 15px;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .nav-links::-webkit-scrollbar { display: none; }
            
            .nav-links a {
                background: #f1f5f9;
                padding: 8px 18px;
                border-radius: 50px;
                flex-shrink: 0;
                border: 1px solid var(--border);
            }
            .btn-cats { flex-shrink: 0; }
            .shipping-card { display: none; } /* Ocultar para limpiar espacio */
            .search-container { order: 3; width: 100%; max-width: 100%; margin-top: 10px; }
            .header-top { flex-wrap: wrap; }
        }

        /* --- BANNERS --- */
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px 5%; }
        .banner { 
            height: 160px; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; 
            justify-content: center; background-size: cover; background-position: center; color: white; transition: 0.3s;
        }
        .banner.fresh { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=800'); }
        .banner.delivery { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1585759071429-1646f76ab8c7?w=800'); }
        .banner h2 { font-size: 1.4rem; font-weight: 800; }
        .banner-btn { width: fit-content; margin-top: 10px; padding: 8px 15px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; }

        /* --- CATEGORÍAS (CARRUSEL) --- */
        .cat-carousel { display: flex; gap: 12px; overflow-x: auto; padding: 15px 5%; scrollbar-width: none; }
        .cat-carousel::-webkit-scrollbar { display: none; }
        .cat-item { 
            min-width: 100px; background: white; padding: 12px; border-radius: 15px; 
            text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .cat-item.active { border-color: var(--main); background: #fff5f5; }
        .cat-icon { font-size: 1.5rem; margin-bottom: 5px; display: block; }
        .cat-item span { font-size: 0.75rem; font-weight: 700; }

        /* --- GRID PRODUCTOS --- */
        .products-section { padding: 0 5% 100px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 15px; 
        }
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } .hero { grid-template-columns: 1fr; } }

        .card { background: white; border-radius: 18px; padding: 10px; border: 1px solid var(--border); position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
        .badge-promo { position: absolute; top: 8px; left: 8px; background: var(--main); color: white; font-size: 0.6rem; font-weight: 800; padding: 3px 7px; border-radius: 5px; }
        .card h4 { font-size: 0.8rem; font-weight: 700; height: 35px; overflow: hidden; margin-bottom: 5px; }
        .price-container { display: flex; align-items: baseline; gap: 5px; }
        .current-price { font-size: 1rem; font-weight: 800; color: var(--dark); }
        .old-price { font-size: 0.75rem; color: var(--gray); text-decoration: line-through; }
        .btn-add { position: absolute; bottom: 10px; right: 10px; background: var(--main); color: white; width: 32px; height: 32px; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- CARRITO (SIDEBAR) --- */
        #sidebar { position: fixed; right: -400px; top: 0; width: 350px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 25px; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        #sidebar.active { right: 0; }
        .cart-list { flex: 1; overflow-y: auto; margin: 15px 0; }
        .btn-check { background: var(--main); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1500; display: none; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <img src="logo.jpg" class="logo-img" alt="Propinec" onclick="location.reload()">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search" style="color: #94a3b8;"></i>
                    <input type="text" id="search" placeholder="¿Qué buscas hoy?">
                </div>
            </div>
            <div class="header-actions">
                <div class="action-item"><i class="fas fa-user"></i> Cuenta</div>
                <div class="action-item" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i> Carrito
                    <span id="count">0</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="nav-links">
            <div class="btn-cats"><i class="fas fa-bars"></i> Categorías</div>
            <a href="#">Inicio</a>
            <a href="#">Ofertas <span class="hot-label">HOT</span></a>
            <a href="#">Nuevos</a>
            <a href="#">Más Vendidos</a>
            <a href="#">Quiénes Somos</a>
            <a href="#">Contacto</a>
        </div>
        <div class="shipping-card">
            <i class="fas fa-bolt"></i> Envío Rápido disponible
        </div>
    </nav>

    <section class="hero">
        <div class="banner fresh">
            <h2>Productos Frescos</h2>
            <button class="banner-btn" style="background: var(--main); color: white;">Ver catálogo</button>
        </div>
        <div class="banner delivery">
            <h2>Recibe en minutos</h2>
            <button class="banner-btn" style="background: var(--success); color: white;">Pedir ahora</button>
        </div>
    </section>

    <div class="cat-carousel" id="cat-list"></div>

    <section class="products-section">
        <h3 id="cat-title" style="margin-bottom:15px; font-weight:800">Todos los productos</h3>
        <div class="grid" id="product-grid"></div>
    </section>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div id="sidebar">
        <div style="display:flex; justify-content:space-between"><h3>Mi Pedido</h3><i class="fas fa-times" onclick="toggleCart()" style="cursor:pointer"></i></div>
        <div class="cart-list" id="cart-items"></div>
        <div style="padding-top:15px; border-top:1px solid #eee">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:800; font-size:1.1rem"><span>Total:</span><span id="total-p">$0.00</span></div>
            <button class="btn-check" onclick="location.href='pago.html'">CONTINUAR COMPRA</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", authDomain: "mi-mini-market.firebaseapp.com", projectId: "mi-mini-market", storageBucket: "mi-mini-market.firebasestorage.app", messagingSenderId: "19960510315", appId: "1:19960510315:web:fe0743420e7ba893b2fe2e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let allProds = [], cart = JSON.parse(sessionStorage.getItem('market_cart')) || [];

    // Categorías
    onSnapshot(query(collection(db, "categorias"), orderBy("nombre", "asc")), (snap) => {
        let h = `<div class="cat-item active" onclick="window.filterCat('Todos', this)"><span class="cat-icon">🏠</span><span>Todos</span></div>`;
        snap.forEach(d => { h += `<div class="cat-item" onclick="window.filterCat('${d.data().nombre}', this)"><span class="cat-icon">${d.data().icono}</span><span>${d.data().nombre}</span></div>`; });
        document.getElementById('cat-list').innerHTML = h;
    });

    // Productos
    onSnapshot(collection(db, "productos"), (snap) => {
        allProds = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderS(allProds);
    });

    function renderS(list) {
        const grid = document.getElementById('product-grid'); grid.innerHTML = '';
        list.filter(p => p.visible !== false && p.stock > 0).forEach(p => {
            let price = p.promoActive ? p.promoPrice : p.price;
            grid.innerHTML += `<div class="card">
                ${p.promoActive ? '<div class="badge-promo">OFERTA</div>' : ''}
                <img src="${p.img}">
                <h4>${p.name}</h4>
                <div class="price-container">
                    <span class="current-price">$${parseFloat(price).toFixed(2)}</span>
                    ${p.promoActive ? `<span class="old-price">$${p.price}</span>` : ''}
                </div>
                <button class="btn-add" onclick="addC('${p.id}','${p.name}',${price},'${p.img}',${p.stock})"><i class="fas fa-plus"></i></button>
            </div>`;
        });
    }

    window.addC = (id, n, p, i, max) => {
        const ex = cart.find(x => x.id === id); if(ex && ex.qty >= max) return;
        ex ? ex.qty++ : cart.push({id, name: n, price: p, img: i, qty: 1});
        save();
    }

    function save() { sessionStorage.setItem('market_cart', JSON.stringify(cart)); renderC(); }
    
    function renderC() {
        let t = 0, c = 0; document.getElementById('cart-items').innerHTML = cart.map(i => {
            t += i.price * i.qty; c += i.qty;
            return `<div style="display:flex; gap:10px; margin-bottom:12px"><img src="${i.img}" width="45" height="45" style="border-radius:8px"><div><b style="font-size:0.8rem">${i.name}</b><br><small>$${i.price} x ${i.qty}</small></div></div>`;
        }).join('');
        document.getElementById('count').innerText = c; document.getElementById('total-p').innerText = `$${t.toFixed(2)}`;
    }

    window.filterCat = (cat, btn) => {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active')); btn.classList.add('active');
        document.getElementById('cat-title').innerText = cat;
        renderS(cat === 'Todos' ? allProds : allProds.filter(p => p.category === cat));
    };

    document.getElementById('search').oninput = (e) => renderS(allProds.filter(p => p.name.toLowerCase().includes(e.target.value.toLowerCase())));
    window.toggleCart = () => { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    renderC();
</script>
</body>
</html>
