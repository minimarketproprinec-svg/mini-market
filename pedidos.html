<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Dashboard Proprinec</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <!-- Librerías para PDF y Iconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --accent: #22c55e; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { background: var(--dark); color: white; min-height: 100vh; }

        /* HEADER ÚNICO */
        header { 
            background: #161e2f; padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;
        }
        .status-pill { 
            background: #064e3b; color: #4ade80; padding: 5px 15px; 
            border-radius: 50px; font-size: 0.8rem; font-weight: 700; 
            display: flex; align-items: center; gap: 8px;
        }
        .pulse { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse-anim 2s infinite; }

        /* ESTADÍSTICAS */
        .container { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card p { font-size: 2.2rem; font-weight: 800; color: #fff; }

        /* TABLA */
        .history-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #334155; }
        .table-header { padding: 15px 20px; border-bottom: 1px solid #334155; background: #161e2f; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { color: #94a3b8; text-align: left; padding: 15px; font-weight: 600; border-bottom: 1px solid #334155; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        tr:hover { background: #2d3a4f; }

        /* ACCIONES */
        .actions { display: flex; gap: 8px; }
        .btn-m { 
            width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; 
            color: white; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
        }
        .btn-print { background: #475569; }
        .btn-pdf { background: var(--danger); }
        .btn-del { background: #334155; }
        .btn-del:hover { background: var(--danger); }

        /* --- SISTEMA DE IMPRESIÓN CORREGIDO --- */
        #factura-area { display: none; } /* Oculto en pantalla */

        @media print {
            /* OCULTAMOS EL DASHBOARD */
            header, .container, .box, audio { display: none !important; }
            /* MOSTRAMOS EL TICKET */
            #factura-area { 
                display: block !important; 
                position: absolute; left: 0; top: 0; width: 100%;
                color: black !important; background: white !important;
                font-family: 'Courier Prime', monospace !important;
            }
            @page { margin: 0; }
        }

        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <h2 style="font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;">MI MINI MARKET PRO</h2>
        <div class="status-pill"><div class="pulse"></div> SISTEMA ACTIVO</div>
    </header>

    <div class="container">
        <!-- CAJA DIARIA -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Ventas de Hoy</h3>
                <p id="stats-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Total en Caja</h3>
                <p id="stats-money">$0.00</p>
            </div>
        </div>

        <!-- LISTADO -->
        <div class="history-card">
            <div class="table-header">
                <h3 style="font-size: 1rem;"><i class="fas fa-receipt"></i> Registro de Pedidos</h3>
                <span style="font-size: 0.7rem; color: #4ade80;">Recuerda hacer un clic para activar sonido 🔊</span>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pedidos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AREA DE IMPRESIÓN (SIN FALLOS) -->
    <div id="factura-area"></div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
        authDomain: "mi-mini-market.firebaseapp.com",
        projectId: "mi-mini-market",
        storageBucket: "mi-mini-market.firebasestorage.app",
        messagingSenderId: "19960510315",
        appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let cargaInicial = false;
    let pedidosCache = [];

    // --- CONEXIÓN EN TIEMPO REAL ---
    onSnapshot(query(collection(db, "pedidos"), orderBy("fecha", "asc")), (snap) => {
        const tbody = document.getElementById('lista-pedidos');
        pedidosCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
        
        let sumaCaja = 0;
        const fechaHoy = new Date().toLocaleDateString();

        tbody.innerHTML = [...pedidosCache].reverse().map(p => {
            if(p.fechaTexto.includes(fechaHoy)) sumaCaja += parseFloat(p.total);
            return `
                <tr>
                    <td>${p.fechaTexto.split(',')[1] || p.fechaTexto}</td>
                    <td><b>${p.cliente.toUpperCase()}</b><br><small style="color:#94a3b8">${p.direccion.ciudadela}</small></td>
                    <td style="color:#22c55e; font-weight:800">$${p.total.toFixed(2)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-m btn-print" onclick="window.accionImprimir('${p.id}')"><i class="fas fa-print"></i></button>
                            <button class="btn-m btn-pdf" onclick="window.accionPDF('${p.id}')"><i class="fas fa-file-pdf"></i></button>
                            <button class="btn-m btn-del" onclick="window.accionBorrar('${p.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
        }).join('');

        document.getElementById('stats-count').innerText = pedidosCache.filter(p => p.fechaTexto.includes(fechaHoy)).length;
        document.getElementById('stats-money').innerText = `$${sumaCaja.toFixed(2)}`;

        if (!cargaInicial) { cargaInicial = true; return; }
        snap.docChanges().forEach(change => {
            if (change.type === "added") window.lanzarImpresion(change.doc.data());
        });
    });

    // --- FUNCIÓN DE DISEÑO ÚNICO ---
    window.formatearTicket = (p) => {
        let items = p.items.map(i => `<div>${i.name.toUpperCase().substring(0,18).padEnd(18)} x${i.qty} $${(i.price*i.qty).toFixed(2)}</div>`).join('');
        return `
            <div style="width: 270px; padding: 10px; color: black; background: white; font-family: 'Courier Prime', monospace; font-size: 13px;">
                <center>
                    <strong style="font-size: 16px;">MI MINI MARKET</strong><br>
                    BABAHOYO, ECUADOR<br>
                    ---------------------------<br>
                    <strong>TICKET DE PEDIDO</strong><br>
                </center>
                <br>
                FECHA: ${p.fechaTexto}<br>
                CLIENTE: ${p.cliente.toUpperCase()}<br>
                CDLA: ${p.direccion.ciudadela.toUpperCase()}<br>
                MZ: ${p.direccion.manzana} &nbsp; VILLA: ${p.direccion.villa}<br>
                PAGO: ${p.pago.toUpperCase()}<br>
                ---------------------------<br>
                ${items}
                ---------------------------<br>
                <strong>TOTAL A PAGAR: $${p.total.toFixed(2)}</strong><br>
                <br>
                <center>GRACIAS POR SU COMPRA</center>
                <br>.
            </div>`;
    };

    window.lanzarImpresion = (p) => {
        document.getElementById('beep').play().catch(()=>{});
        document.getElementById('factura-area').innerHTML = window.formatearTicket(p);
        setTimeout(() => { window.print(); }, 800);
    };

    window.accionImprimir = (id) => {
        const p = pedidosCache.find(i => i.id === id);
        if(p) window.lanzarImpresion(p);
    };

    window.accionBorrar = async (id) => {
        if(prompt("🔐 Clave Admin para borrar:") === "2024") {
            await deleteDoc(doc(db, "pedidos", id));
        } else { alert("Error: Clave incorrecta"); }
    };

    window.accionPDF = (id) => {
        const p = pedidosCache.find(i => i.id === id);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: [80, 150] });

        pdf.setFont("courier", "bold");
        pdf.text("MI MINI MARKET", 40, 10, { align: "center" });
        pdf.setFontSize(9);
        pdf.text("TICKET DE VENTA", 40, 15, { align: "center" });
        pdf.setFont("courier", "normal");
        pdf.text(`CLIENTE: ${p.cliente.toUpperCase()}`, 5, 25);
        pdf.text(`TOTAL: $${p.total.toFixed(2)}`, 5, 30);
        pdf.text("-------------------------", 40, 35, { align: "center" });
        
        let y = 42;
        p.items.forEach(i => {
            pdf.text(`${i.name.substring(0,15)} x${i.qty}`, 5, y);
            pdf.text(`$${(i.price*i.qty).toFixed(2)}`, 75, y, { align: "right" });
            y += 5;
        });

        pdf.save(`Ticket_${p.cliente}.pdf`);
    };

    document.addEventListener('click', () => { console.log("Sonido Activo"); });
</script>
</body>
</html>
