<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Pedidos | Mi Mini Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <!-- Librerías de Audio, PDF y Fotos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --accent: #22c55e; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { background: var(--dark); color: white; padding-bottom: 50px; min-height: 100vh; }

        /* BARRA SUPERIOR PRO */
        header { 
            background: #161e2f; padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;
        }
        .status-pill { 
            background: #064e3b; color: #4ade80; padding: 5px 15px; 
            border-radius: 50px; font-size: 0.8rem; font-weight: 700; 
            display: flex; align-items: center; gap: 8px; border: 1px solid #065f46;
        }
        .pulse { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse-anim 2s infinite; }

        /* CONTENEDOR PRINCIPAL */
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        /* CUADROS DE ESTADÍSTICAS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card p { font-size: 2rem; font-weight: 800; color: #fff; }

        /* TABLA DE PEDIDOS */
        .history-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .table-header { padding: 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #161e2f; color: #94a3b8; text-align: left; padding: 15px; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        tr:hover { background: #2d3a4f; }

        /* BOTONES DE ACCIÓN */
        .actions { display: flex; gap: 8px; }
        .btn-mini { 
            width: 35px; height: 35px; border-radius: 8px; border: none; cursor: pointer; 
            color: white; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-p { background: #475569; }
        .btn-d { background: var(--danger); }
        .btn-t { background: #334155; }
        .btn-mini:hover { transform: scale(1.1); }

        /* FORMATO TICKET PARA IMPRESIÓN */
        #factura-imprimir { 
            position: fixed; left: -9999px; top: 0; width: 280px; background: white; color: black; padding: 10px;
        }

        @media print {
            body * { display: none !important; }
            #factura-imprimir { display: block !important; left: 0 !important; position: static !important; font-family: 'Courier Prime', monospace !important; }
            @page { margin: 0; }
        }

        @keyframes pulse-anim { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h2 style="font-weight: 800; font-size: 1.2rem;">MINI MARKET PROPRINEC</h2>
        <div class="status-pill"><div class="pulse"></div> EN LÍNEA</div>
    </header>

    <div class="container">
        
        <!-- ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Pedidos Hoy</h3>
                <p id="total-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Venta del Día</h3>
                <p id="total-money">$0.00</p>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="history-card">
            <div class="table-header">
                <h3 style="font-weight: 700;"><i class="fas fa-list-ul"></i> Historial de Pedidos</h3>
                <span style="font-size: 0.7rem; color: #94a3b8;">Haga clic para activar sonido 🔊</span>
            </div>
            <div style="overflow-x: auto;">
                <table id="table-pedidos">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Sector</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Carga desde Firebase -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR OCULTO PARA IMPRESIÓN Y PDF -->
    <div id="factura-imprimir"></div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
        authDomain: "mi-mini-market.firebaseapp.com",
        projectId: "mi-mini-market",
        storageBucket: "mi-mini-market.firebasestorage.app",
        messagingSenderId: "19960510315",
        appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let cargaHecha = false;
    let memoriaLocal = [];

    // --- ESCUCHAR DATOS ---
    onSnapshot(query(collection(db, "pedidos"), orderBy("fecha", "asc")), (snap) => {
        const body = document.getElementById('history-body');
        const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
        memoriaLocal = docs;
        
        let ventasHoy = 0;
        const hoy = new Date().toLocaleDateString();

        // Renderizar tabla
        body.innerHTML = [...docs].reverse().map(p => {
            if(p.fechaTexto.includes(hoy)) ventasHoy += parseFloat(p.total);
            return `
                <tr>
                    <td>${p.fechaTexto.split(',')[1] || p.fechaTexto}</td>
                    <td><b>${p.cliente}</b></td>
                    <td>${p.direccion.ciudadela}</td>
                    <td style="color:#4ade80; font-weight:800">$${p.total.toFixed(2)}</td>
                    <td class="actions">
                        <button class="btn-mini btn-t" onclick="window.reimprimir('${p.id}')" title="Reimprimir"><i class="fas fa-print"></i></button>
                        <button class="btn-mini btn-p" onclick="window.bajarPDF('${p.id}')" title="PDF"><i class="fas fa-file-pdf"></i></button>
                        <button class="btn-mini btn-d" onclick="window.borrarPedido('${p.id}')" title="Borrar"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('total-count').innerText = docs.filter(p => p.fechaTexto.includes(hoy)).length;
        document.getElementById('total-money').innerText = `$${ventasHoy.toFixed(2)}`;

        // Auto-impresión para nuevos
        if (!cargaHecha) { cargaHecha = true; return; }
        snap.docChanges().forEach(change => {
            if (change.type === "added") lanzarImpresion(change.doc.data());
        });
    });

    // --- DISEÑADOR DE TICKET ---
    function generarHTMLTicket(p) {
        let itemsHtml = "";
        p.items.forEach(i => {
            itemsHtml += `<div>${i.name.toUpperCase().substring(0,18).padEnd(18)} x${i.qty} $${(i.price*i.qty).toFixed(2)}</div>`;
        });

        return `
            <div id="capture-area" style="width: 270px; padding: 10px; background: white; color: black; font-family: 'Courier Prime', monospace; font-size: 13px;">
                <center>
                    <strong style="font-size: 16px;">MI MINI MARKET</strong><br>
                    BABAHOYO - ECUADOR<br>
                    ---------------------------<br>
                    <strong>ORDEN DE ENTREGA</strong><br>
                </center>
                <br>
                <b>HORA:</b> ${p.fechaTexto}<br>
                <b>CLIENTE:</b> ${p.cliente.toUpperCase()}<br>
                <b>CDLA:</b> ${p.direccion.ciudadela.toUpperCase()}<br>
                <b>MZ:</b> ${p.direccion.manzana} &nbsp; <b>VILLA:</b> ${p.direccion.villa}<br>
                <b>PAGO:</b> ${p.pago.toUpperCase()}<br>
                ${p.pagaCon ? '<b>VALOR:</b> $' + p.pagaCon : ''}<br>
                ---------------------------<br>
                ${itemsHtml}
                ---------------------------<br>
                <strong style="font-size: 15px;">TOTAL: $${p.total.toFixed(2)}</strong><br>
                <br>
                <center>GRACIAS POR SU COMPRA</center>
                <br>
            </div>
        `;
    }

    function lanzarImpresion(p) {
        document.getElementById('beep').play().catch(()=>{});
        document.getElementById('factura-imprimir').innerHTML = generarHTMLTicket(p);
        setTimeout(() => { window.print(); }, 800);
    }

    window.reimprimir = (id) => {
        const p = memoriaLocal.find(i => i.id === id);
        if(p) lanzarImpresion(p);
    };

    window.borrarPedido = async (id) => {
        const pin = prompt("🔐 Ingrese clave admin para borrar:");
        if(pin === "2024") {
            if(confirm("¿Eliminar este pedido definitivamente?")) {
                await deleteDoc(doc(db, "pedidos", id));
            }
        } else { alert("Clave incorrecta"); }
    };

    window.bajarPDF = async (id) => {
        const p = memoriaLocal.find(i => i.id === id);
        const area = document.getElementById('factura-imprimir');
        area.innerHTML = generarHTMLTicket(p);
        
        // El truco para PDF perfecto:
        area.style.position = "static";
        area.style.left = "0";
        
        try {
            const canvas = await html2canvas(document.querySelector("#capture-area"), { scale: 3, backgroundColor: "#fff" });
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: [80, (canvas.height * 80) / canvas.width] });
            pdf.addImage(imgData, 'PNG', 0, 0, 80, (canvas.height * 80) / canvas.width);
            pdf.save(`Ticket_${p.cliente}.pdf`);
        } catch (e) {
            alert("Error al generar PDF. Intente de nuevo.");
        } finally {
            area.style.position = "fixed";
            area.style.left = "-9999px";
        }
    };

    document.addEventListener('click', () => { console.log("Canal de audio activo"); });
</script>
</body>
</html>
