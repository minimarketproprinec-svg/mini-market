<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística y Despacho | MINI PROPRINEC SYSTEM</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --main: #ff4b4b; 
            --dark: #0f172a; 
            --bg: #f1f5f9; 
            --success: #10b981; 
            --way: #3b82f6; 
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--dark); min-height: 100vh; }

        /* HEADER */
        header { 
            background: white; padding: 15px 30px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .status-live { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--success); }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* CONTENIDO */
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid var(--border); }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 800; border-bottom: 1px solid var(--border); }
        td { padding: 12px; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; }

        /* BADGES */
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-prep { background: #fff7ed; color: #c2410c; }
        .bg-way { background: #eff6ff; color: #1d4ed8; }
        .bg-ok { background: #ecfdf5; color: #047857; }

        /* BOTONES */
        .btn-group { display: flex; gap: 4px; }
        .btn-action { 
            width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; transition: 0.2s; color: white;
        }
        .btn-prep { background: #f59e0b; }
        .btn-way { background: var(--way); }
        .btn-ok { background: var(--success); }
        .btn-print { background: var(--dark); }
        .btn-del { background: #cbd5e1; color: #475569; }
        .btn-action:hover { transform: translateY(-2px); opacity: 0.9; }

        /* --- TICKET DE IMPRESIÓN (OCULTO EN PANTALLA) --- */
        #master-ticket { 
            display: none; /* Oculto en vista normal */
        }

        @media print {
            body * { visibility: hidden; }
            #master-ticket, #master-ticket * { visibility: visible; }
            #master-ticket { 
                display: block !important;
                position: absolute; 
                left: 0; top: 0; 
                width: 58mm; /* Ajustar a 80mm si tu papel es más ancho */
                padding: 2mm;
                font-family: 'Courier Prime', monospace; 
                font-size: 11px; 
                color: black;
                background: white;
            }
            .t-header { text-align: center; margin-bottom: 5px; }
            .t-divider { border-top: 1px dashed #000; margin: 5px 0; }
            .t-item { display: flex; justify-content: space-between; margin-bottom: 2px; }
            .t-total { font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <h2 style="font-weight: 800; letter-spacing: -1px; color: var(--dark)">PROPRINEC <span style="color: var(--main)">SYSTEM</span></h2>
        </div>
        <div class="status-live">
            <i class="fas fa-print"></i> AUTO-PRINT ACTIVO
            <div class="dot"></div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Cliente</th>
                        <th>Ubicación</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones de Despacho</th>
                    </tr>
                </thead>
                <tbody id="p-body">
                    <tr><td colspan="6" style="text-align:center; padding:40px; color:#94a3b8 italic">Cargando pedidos de Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- CONTENEDOR DE TICKET ÚNICO -->
    <div id="master-ticket">
        <div class="t-header">
            <strong style="font-size: 14px;">MINI MARKET PROPRINEC</strong><br>
            <span>"Donde más barato es"</span><br>
            <span>Babahoyo, Ecuador</span><br>
            <span id="t-tel">Tel: 0993252739</span>
        </div>
        <div class="t-divider"></div>
        <div>
            FECHA: <span id="t-fecha"></span><br>
            CLIENTE: <span id="t-cliente"></span><br>
            DIR: <span id="t-dir"></span>
        </div>
        <div class="t-divider"></div>
        <div id="t-items">
            <!-- Items dinámicos -->
        </div>
        <div class="t-divider"></div>
        <div class="t-item"><span>SUBTOTAL:</span> <span id="t-sub"></span></div>
        <div class="t-item"><span>ENVÍO:</span> <span>$1.00</span></div>
        <div class="t-total"><span>TOTAL:</span> <span id="t-total"></span></div>
        <div class="t-divider"></div>
        <div style="text-align: center;">
            PAGO: <span id="t-pago"></span><br>
            <strong id="t-billete"></strong><br><br>
            ¡GRACIAS POR SU COMPRA!
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", 
        authDomain: "mi-mini-market.firebaseapp.com", 
        projectId: "mi-mini-market", 
        storageBucket: "mi-mini-market.firebasestorage.app", 
        messagingSenderId: "19960510315", 
        appId: "1:19960510315:web:fe0743420e7ba893b2fe2e" 
    };

    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app);

    let ready = false;
    let pedidosCache = [];

    // 1. Escuchar pedidos en tiempo real
    onSnapshot(query(collection(db, "pedidos"), orderBy("fecha", "desc"), limit(50)), (snap) => {
        pedidosCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
        
        renderPedidos(pedidosCache);

        // La primera vez que carga, marca como ready y no imprime nada
        if (!ready) { 
            ready = true; 
            console.log("Sistema sincronizado. Esperando pedidos nuevos...");
            return; 
        }

        // Detectar SOLO pedidos nuevos
        snap.docChanges().forEach(change => {
            if (change.type === "added") {
                console.log("¡Nuevo pedido recibido!");
                const nuevoPedido = change.doc.data();
                
                // Reproducir sonido
                const beep = document.getElementById('beep');
                beep.play().catch(() => console.log("Clic en la página para habilitar sonido"));

                // DISPARAR IMPRESIÓN AUTOMÁTICA
                window.generarTicket(nuevoPedido, true); 
            }
        });
    });

    function renderPedidos(lista) {
        const body = document.getElementById('p-body');
        if (lista.length === 0) {
            body.innerHTML = `<tr><td colspan="6" style="text-align:center">No hay pedidos hoy</td></tr>`;
            return;
        }

        body.innerHTML = lista.map(p => {
            let badgeClass = p.estado === 'Preparando' ? 'bg-prep' : (p.estado === 'En camino' ? 'bg-way' : 'bg-ok');
            let hora = p.fechaTexto ? p.fechaTexto.split(',')[1] : 'Reciente';
            
            return `
            <tr>
                <td><small>${hora}</small></td>
                <td><b>${p.cliente.toUpperCase()}</b></td>
                <td><small>${p.direccion.ciudadela}<br>Mz ${p.direccion.manzana} Vlla ${p.direccion.villa}</small></td>
                <td><span class="badge" style="background:#f1f5f9; color:#475569">$${p.total.toFixed(2)} (${p.pago})</span></td>
                <td><span class="badge ${badgeClass}">${p.estado}</span></td>
                <td>
                    <div class="btn-group">
                        <button class="btn-action btn-prep" onclick="updEstado('${p.id}','Preparando')"><i class="fas fa-box"></i></button>
                        <button class="btn-action btn-way" onclick="updEstado('${p.id}','En camino')"><i class="fas fa-motorcycle"></i></button>
                        <button class="btn-action btn-ok" onclick="updEstado('${p.id}','Entregado')"><i class="fas fa-check"></i></button>
                        <button class="btn-action btn-print" onclick="reimprimir('${p.id}')"><i class="fas fa-print"></i></button>
                        <button class="btn-action btn-del" onclick="eliminarPedido('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    // 2. Lógica de Llenado de Ticket
    window.generarTicket = (p, autoPrint = false) => {
        document.getElementById('t-fecha').innerText = p.fechaTexto || new Date().toLocaleString();
        document.getElementById('t-cliente').innerText = p.cliente.toUpperCase();
        document.getElementById('t-dir').innerText = `${p.direccion.ciudadela}, Mz ${p.direccion.manzana} Vlla ${p.direccion.villa}`;
        document.getElementById('t-pago').innerText = p.pago.toUpperCase();
        document.getElementById('t-billete').innerText = (p.pago === 'Efectivo' && p.billete) ? `PAGA CON: ${p.billete}` : '';
        
        let subtotal = p.total - 1.00;
        document.getElementById('t-sub').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('t-total').innerText = `$${p.total.toFixed(2)}`;

        let itemsHtml = p.items.map(i => `
            <div class="t-item">
                <span>${i.qty} x ${i.name.substring(0,18)}</span>
                <span>$${(i.price * i.qty).toFixed(2)}</span>
            </div>
        `).join('');
        document.getElementById('t-items').innerHTML = itemsHtml;

        if(autoPrint) {
            // Un pequeño delay asegura que el DOM se actualice antes de imprimir
            setTimeout(() => {
                window.print();
            }, 1000);
        }
    };

    window.reimprimir = (id) => {
        const ped = pedidosCache.find(x => x.id === id);
        if(ped) window.generarTicket(ped, true);
    };

    window.updEstado = async (id, nuevoE) => {
        await updateDoc(doc(db, "pedidos", id), { estado: nuevoE });
    };

    window.eliminarPedido = async (id) => {
        if(confirm("¿Seguro que deseas eliminar este pedido?")) {
            await deleteDoc(doc(db, "pedidos", id));
        }
    };

    // Habilitar audio
    document.addEventListener('click', () => {
        const audio = document.getElementById('beep');
        audio.play().then(() => { audio.pause(); audio.currentTime = 0; });
    }, { once: true });

</script>
</body>
</html>
