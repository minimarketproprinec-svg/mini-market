<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE PEDIDOS | Monitor & Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO PARA LA PANTALLA --- */
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .monitor-box { background: white; color: #1e293b; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-width: 450px; width: 95%; margin-bottom: 30px; }
        .status-badge { background: #dcfce7; color: #166534; padding: 8px 20px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .history-container { background: #1e293b; width: 95%; max-width: 900px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { margin: 0 0 20px 0; font-size: 1.2rem; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
        
        .history-table { width: 100%; border-collapse: collapse; color: #cbd5e1; font-size: 0.85rem; }
        .history-table th { text-align: left; padding: 12px; border-bottom: 2px solid #334155; color: #f8fafc; }
        .history-table td { padding: 12px; border-bottom: 1px solid #334155; }
        
        .btn-action { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: white; display: inline-flex; align-items: center; gap: 5px; }
        .btn-reprint { background: #475569; margin-right: 5px; }
        .btn-pdf { background: #ef4444; }

        /* --- CONFIGURACIÓN CRÍTICA PARA IMPRESIÓN --- */
        #factura-imprimir { 
            display: none; 
        }

        @media print {
            /* NO ocultamos el body, ocultamos solo los elementos visuales del monitor */
            body { 
                background: white !important; 
            }
            .monitor-box, .history-container, audio, i, button { 
                display: none !important; 
            }
            /* Mostramos la factura en la parte superior */
            #factura-imprimir { 
                display: block !important; 
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                color: black !important;
                background: white !important;
                font-family: 'Courier Prime', monospace !important;
            }
        }
    </style>
</head>
<body>

    <div class="monitor-box">
        <div style="font-size: 3rem;">📠</div>
        <h1 style="margin: 5px 0; font-weight: 800;">CENTRO DE IMPRESIÓN</h1>
        <div class="status-badge"><div class="pulse"></div> SISTEMA CONECTADO</div>
        <p style="font-size: 0.75rem; margin-top: 10px; color: #64748b;">Haga clic en el fondo para activar audio.</p>
    </div>

    <div class="history-container">
        <h2><i class="fas fa-history"></i> Pedidos Recientes</h2>
        <div style="overflow-x: auto;">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <!-- AQUÍ SE CARGA EL TICKET -->
    <div id="factura-imprimir"></div>
    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c",
        authDomain: "mi-mini-market.firebaseapp.com",
        projectId: "mi-mini-market",
        storageBucket: "mi-mini-market.firebasestorage.app",
        messagingSenderId: "19960510315",
        appId: "1:19960510315:web:fe0743420e7ba893b2fe2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let yaCargoTodo = false;
    let baseDatosMemoria = [];

    // Escuchar últimos 20 pedidos
    const q = query(collection(db, "pedidos"), orderBy("fecha", "desc"), limit(20));

    onSnapshot(q, (snapshot) => {
        const bodyTable = document.getElementById('history-body');
        bodyTable.innerHTML = "";
        baseDatosMemoria = [];

        snapshot.docs.forEach((docSnap) => {
            const data = docSnap.data();
            const idDoc = docSnap.id;
            baseDatosMemoria.push({ id: idDoc, ...data });

            bodyTable.innerHTML += `
                <tr>
                    <td><small>${data.fechaTexto}</small></td>
                    <td><b>${data.cliente}</b></td>
                    <td style="color:#22c55e; font-weight:bold">$${data.total.toFixed(2)}</td>
                    <td>
                        <button class="btn-action btn-reprint" onclick="window.reimprimir('${idDoc}')">Reimprimir</button>
                        <button class="btn-action btn-pdf" onclick="window.descargarPDF('${idDoc}')">PDF</button>
                    </td>
                </tr>
            `;
        });

        // Solo activar impresión automática para nuevos
        if (!yaCargoTodo) { yaCargoTodo = true; return; }

        snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
                lanzarImpresora(change.doc.data());
            }
        });
    });

    function lanzarImpresora(p) {
        document.getElementById('beep').play().catch(() => {});
        
        let prods = "";
        p.items.forEach(i => {
            prods += `<div>${i.name.toUpperCase().substring(0,18)} x${i.qty} $${(i.price*i.qty).toFixed(2)}</div>`;
        });

        const ticketHTML = `
            <div style="width: 280px; padding: 10px; color: black; background: white; font-family: 'Courier Prime', monospace;">
                <center>
                    <strong style="font-size: 1.1rem;">MI MINI MARKET</strong><br>
                    BABAHOYO, ECUADOR<br>
                    ---------------------------<br>
                    <strong>TICKET DE VENTA</strong><br>
                </center>
                <br>
                <b>FECHA:</b> ${p.fechaTexto}<br>
                <b>CLIENTE:</b> ${p.cliente.toUpperCase()}<br>
                <b>SECTOR:</b> ${p.direccion.ciudadela.toUpperCase()}<br>
                <b>MZ:</b> ${p.direccion.manzana} &nbsp; <b>VILLA:</b> ${p.direccion.villa}<br>
                <b>PAGO:</b> ${p.pago.toUpperCase()}<br>
                ---------------------------<br>
                ${prods}
                ---------------------------<br>
                <strong style="font-size: 1rem;">TOTAL: $${p.total.toFixed(2)}</strong><br>
                <br>
                <center>¡GRACIAS POR COMPRAR!</center>
                <br>.
            </div>
        `;

        document.getElementById('factura-imprimir').innerHTML = ticketHTML;

        // Espera un segundo para asegurar que el navegador cargue el texto
        setTimeout(() => {
            window.print();
        }, 1000);
    }

    window.reimprimir = (id) => {
        const pedido = baseDatosMemoria.find(item => item.id === id);
        if(pedido) lanzarImpresora(pedido);
    };

    window.descargarPDF = (id) => {
        const p = baseDatosMemoria.find(item => item.id === id);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: [80, 150] });

        doc.setFont("courier", "bold");
        doc.text("MI MINI MARKET", 40, 10, { align: "center" });
        doc.setFont("courier", "normal");
        doc.setFontSize(9);
        doc.text(`CLIENTE: ${p.cliente}`, 5, 20);
        doc.text(`TOTAL: $${p.total.toFixed(2)}`, 5, 25);
        doc.text(`PAGO: ${p.pago}`, 5, 30);
        doc.text("-------------------------", 40, 35, { align: "center" });
        
        let y = 40;
        p.items.forEach(i => {
            doc.text(`${i.name} x${i.qty}`, 5, y);
            y += 5;
        });

        doc.save(`Pedido_${p.cliente}.pdf`);
    };

    document.addEventListener('click', () => { console.log("Audio activado"); });
</script>
</body>
</html>
