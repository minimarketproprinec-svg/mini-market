<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Dashboard Proprinec</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0f172a; --panel: #1e293b; --accent: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 50px; min-height: 100vh; overflow-x: hidden; }
        header { background: #161e2f; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); padding: 25px; border-radius: 24px; border: 1px solid #334155; text-align: center; }
        .history-card { background: var(--panel); border-radius: 24px; border: 1px solid #334155; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #161e2f; color: #94a3b8; text-align: left; padding: 18px; }
        td { padding: 18px; border-bottom: 1px solid #334155; }
        .btn-ui { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; color: white; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
        #master-print-container { position: fixed; left: -9999px; top: 0; width: 280px; background: white; color: black; padding: 10px; }
        @media print { body * { visibility: hidden; } #master-print-container, #master-print-container * { visibility: visible; }
            #master-print-container { display: block !important; position: absolute; left: 0; top: 0; width: 100%; font-family: 'Courier Prime', monospace !important; }
            @page { margin: 0; size: auto; } html, body { height: auto; overflow: visible; } }
    </style>
</head>
<body>
    <header><h2 style="font-weight: 800;">DASHBOARD PEDIDOS</h2><div style="color: #4ade80; font-weight: 700;">● SISTEMA EN LINEA</div></header>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><h3>Hoy</h3><p id="st-count" style="font-size: 2.2rem; font-weight: 800;">0</p></div>
            <div class="stat-card"><h3>Venta</h3><p id="st-money" style="font-size: 2.2rem; font-weight: 800;">$0.00</p></div>
        </div>
        <div class="history-card">
            <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;"><h3>Historial Pro</h3><span style="font-size:0.7rem; color: #4ade80;">Clic en pantalla para sonido 🔊</span></div>
            <div style="overflow-x: auto;"><table><thead><tr><th>Hora</th><th>Cliente / Sector</th><th>Total</th><th>Acción</th></tr></thead><tbody id="p-body"></tbody></table></div>
        </div>
    </div>
    <div id="master-print-container"></div>
    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyADC-f3HCv-jIoY4frUbpfRB3lY6qXMK8c", authDomain: "mi-mini-market.firebaseapp.com", projectId: "mi-mini-market", storageBucket: "mi-mini-market.firebasestorage.app", messagingSenderId: "19960510315", appId: "1:19960510315:web:fe0743420e7ba893b2fe2e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let ready = false, cache = [];

    onSnapshot(query(collection(db, "pedidos"), orderBy("fecha", "asc"), limit(50)), (snap) => {
        const body = document.getElementById('p-body'); cache = snap.docs.map(d => ({id: d.id, ...d.data()}));
        let t = 0, c = 0, hoy = new Date().toLocaleDateString();
        body.innerHTML = [...cache].reverse().map(p => {
            if(p.fechaTexto.includes(hoy)) { t += p.total; c++; }
            return `<tr><td>${p.fechaTexto.split(',')[1]}</td><td><b>${p.cliente.toUpperCase()}</b><br><small>${p.direccion.ciudadela}</small></td>
            <td style="color:#22c55e; font-weight:800">$${p.total.toFixed(2)}</td><td><div style="display:flex; gap:5px">
            <button class="btn-ui" style="background:#475569" onclick="window.reim('${p.id}')"><i class="fas fa-print"></i></button>
            <button class="btn-ui" style="background:#ef4444" onclick="window.pdf('${p.id}')"><i class="fas fa-file-pdf"></i></button>
            <button class="btn-ui" style="background:#334155" onclick="window.del('${p.id}')"><i class="fas fa-trash"></i></button></div></td></tr>`;
        }).join('');
        document.getElementById('st-count').innerText = c; document.getElementById('st-money').innerText = `$${t.toFixed(2)}`;
        if (!ready) { ready = true; return; }
        snap.docChanges().forEach(ch => { if (change.type === "added") window.imprimirAuto(ch.doc.data()); });
    });

    window.disenar = (p) => {
        let its = p.items.map(i => `<div style="display:flex; justify-content:space-between"><span>${i.name.toUpperCase().substring(0,18)} x${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('');
        return `<div id="pos-box" style="width: 260px; padding: 10px; background: white; color: black; font-family: 'Courier Prime', monospace; line-height: 1.1; font-size: 13px;">
        <center><strong>MEGA MINIMARKET</strong><br>PROPRINEC<br>----------------------------<br><strong>ORDEN DE ENTREGA</strong><br></center><br>
        FECHA: ${p.fechaTexto}<br>CLIENTE: ${p.cliente.toUpperCase()}<br>CDLA: ${p.direccion.ciudadela.toUpperCase()}<br>MZ: ${p.direccion.manzana} VILLA: ${p.direccion.villa}<br>PAGO: ${p.pago.toUpperCase()}<br>
        ${p.pagaCon ? 'VUELTO DE: $' + p.pagaCon : ''}<br>----------------------------<br>${its}----------------------------<br>
        <div style="display:flex; justify-content:space-between; font-size: 15px; font-weight: bold;"><span>TOTAL:</span><span>$${p.total.toFixed(2)}</span></div><br><center>¡GRACIAS POR SU COMPRA!</center></div>`;
    };

    window.imprimirAuto = (p) => { document.getElementById('beep').play().catch(()=>{}); document.getElementById('master-print-container').innerHTML = window.disenar(p); setTimeout(() => window.print(), 1000); };
    window.reim = (id) => { const p = cache.find(i => i.id === id); if(p) window.imprimirAuto(p); };
    window.del = async (id) => { if(prompt("🔐 Clave Admin:") === "2024") await deleteDoc(doc(db, "pedidos", id)); };
    window.pdf = async (id) => {
        const p = cache.find(i => i.id === id); const area = document.getElementById('master-print-container'); area.innerHTML = window.disenar(p); area.style.left = "0";
        const can = await html2canvas(document.querySelector("#pos-box"), { scale: 3, backgroundColor: "#fff" });
        const pdf = new jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: [80, (can.height * 80) / can.width] });
        pdf.addImage(can.toDataURL('image/png'), 'PNG', 0, 0, 80, (can.height * 80) / can.width);
        pdf.save(`Ticket_${p.cliente}.pdf`); area.style.left = "-9999px";
    };
    document.addEventListener('click', () => console.log("Audio listo"));
</script>
</body>
</html>
